<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firsthill · stats</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
    <div id="fhNav"></div>

    <div class="page-head">
        <div>
            <h1 id="title">Storeroom stats</h1>
            <p id="trackNote">Loading…</p>
        </div>
        <div class="toolbar" style="margin:0;">
            <label style="font-size:0.82rem; color:var(--muted);">Storeroom
                <select id="storeSel"><option value="">All storerooms</option></select>
            </label>
            <label style="font-size:0.82rem; color:var(--muted);">Period
                <select id="periodSel">
                    <option value="7">Last 7 days</option>
                    <option value="30" selected>Last 30 days</option>
                    <option value="90">Last 90 days</option>
                    <option value="365">Last 12 months</option>
                </select>
            </label>
        </div>
    </div>

    <div id="content">
        <div class="empty"><i class="fas fa-spinner fa-pulse"></i> Crunching the numbers…</div>
    </div>
    <div class="footnote">FirstHill (pty) ltd · stats from the update history</div>
</div>

<script src="i18n.js"></script>
<script src="common.js"></script>
<script>
    (function () {
        const me = FH.requireLogin('stats.html');
        if (!me) return;
        const esc = FH.esc, T = FH.t;   // (t is used as a loop variable below)
        const DAY = FH.DAY;

        let items = [], rows = [], lowDefault = 4, firstEver = null;
        const storeSel = document.getElementById('storeSel');
        const periodSel = document.getElementById('periodSel');
        const content = document.getElementById('content');

        const fmt = n => Math.round(n).toLocaleString('en-GB');
        const tyreKey = (b, s) => b + ' ' + s;

        function bars(list, unit = '') {
            if (!list.length) return '<div class="empty">No movements in this period.</div>';
            const max = Math.max(...list.map(x => x.v), 1);
            return `<div class="hbars">${list.map(x => `
                <div class="hbar" title="${esc(x.name)}: ${fmt(x.v)}${unit}">
                    <span class="name">${esc(x.name)}</span>
                    <span class="track"><span class="fill" style="width:${(x.v / max * 100).toFixed(1)}%; display:block;"></span></span>
                    <span class="val">${fmt(x.v)}${x.extra ? `<small style="color:var(--faint); font-weight:400;"> ${x.extra}</small>` : ''}</span>
                </div>`).join('')}</div>`;
        }

        function coverText(days) {
            if (days == null) return '—';
            if (days < 1) return T('under a day');
            if (days > 365) return T('over a year');
            return T('~{n} days', { n: Math.round(days) });
        }

        function dayChart(ev, days, since) {
            const weekly = days > 120;
            const size = weekly ? 7 : 1;
            const start = new Date(since); start.setHours(0, 0, 0, 0);
            const n = Math.ceil((Date.now() - start.getTime()) / (DAY * size));
            const buckets = Array.from({ length: n }, (_, k) => ({ t: start.getTime() + k * size * DAY, in: 0, out: 0 }));
            ev.forEach(e => {
                const k = Math.floor((e.t.getTime() - start.getTime()) / (DAY * size));
                if (k < 0 || k >= n) return;
                if (e.d > 0) buckets[k].in += e.d; else buckets[k].out += -e.d;
            });
            const max = Math.max(1, ...buckets.map(b => Math.max(b.in, b.out)));
            const label = t => new Date(t).toLocaleDateString(FH.locale(), { day: '2-digit', month: 'short' });
            return `<div class="legend"><span class="l-in">Added</span><span class="l-out">Taken out</span><span style="margin-left:auto">${weekly ? T('per week') : T('per day')}</span></div>
                <div class="daychart">${buckets.map(b => `
                    <div class="col" title="${T(weekly ? 'Week of {date}: +{in} added, −{out} taken out' : '{date}: +{in} added, −{out} taken out', { date: label(b.t), in: b.in, out: b.out })}">
                        <div class="up"><div class="bar in" style="height:${(b.in / max * 100).toFixed(1)}%"></div></div>
                        <div class="down"><div class="bar out" style="height:${(b.out / max * 100).toFixed(1)}%"></div></div>
                    </div>`).join('')}</div>
                <div class="chart-axis"><span>${label(buckets[0]?.t)}</span><span>${label(buckets[Math.floor(n / 2)]?.t)}</span><span>${T('Today')}</span></div>`;
        }

        function render() {
            const store = storeSel.value;
            const days = Number(periodSel.value);
            const since = Date.now() - days * DAY;
            // if tracking started inside the period, rates use the tracked days only
            const trackedDays = firstEver ? Math.max(1, Math.min(days, (Date.now() - firstEver) / DAY)) : days;

            document.getElementById('title').textContent = store ? T('{store} stats', { store }) : T('All storerooms');

            const ev = rows
                .filter(r => (!store || r.storeroom === store) && r.t && r.t.getTime() >= since);
            const scope = store ? items.filter(i => i.storeroom === store) : items;

            const outUnits = ev.reduce((a, e) => a + (e.d < 0 ? -e.d : 0), 0);
            const inUnits = ev.reduce((a, e) => a + (e.d > 0 ? e.d : 0), 0);
            const onHand = scope.reduce((a, i) => a + i.qty, 0);
            const needOrder = scope.filter(i => ['low', 'out'].includes(FH.statusOf(i, lowDefault))).length;
            const perDay = outUnits / trackedDays;

            // --- per tyre (brand + size, summed over the storerooms in scope) ---
            const tyres = {};
            const tyre = (b, s) => (tyres[tyreKey(b, s)] ||= { brand: b, size: s, out: 0, outTimes: 0, in: 0, stock: 0 });
            scope.forEach(i => { tyre(i.brand, i.size).stock += i.qty; });
            ev.forEach(e => {
                const t = tyre(e.brand, e.size);
                if (e.d < 0) { t.out += -e.d; t.outTimes++; } else t.in += e.d;
            });
            const tyreList = Object.values(tyres);
            tyreList.forEach(t => { t.rate = t.out / trackedDays; t.cover = t.rate > 0 ? t.stock / t.rate : null; });

            const top = tyreList.filter(t => t.out > 0).sort((a, b) => b.out - a.out).slice(0, 10);
            const runningOut = tyreList.filter(t => t.cover != null && t.cover <= 21).sort((a, b) => a.cover - b.cover).slice(0, 10);

            // slow movers: stock on hand, nothing taken out this period
            const movedKeys = new Set(ev.filter(e => e.d < 0).map(e => FH.keyOf(e.brand, e.size, e.storeroom)));
            const slow = scope.filter(i => i.qty > 0 && !movedKeys.has(FH.keyOf(i.brand, i.size, i.storeroom)))
                .sort((a, b) => b.qty - a.qty).slice(0, 10);
            const slowTotal = scope.filter(i => i.qty > 0 && !movedKeys.has(FH.keyOf(i.brand, i.size, i.storeroom)))
                .reduce((a, i) => a + i.qty, 0);

            // brand share of tyres taken out
            const byBrand = {};
            ev.forEach(e => { if (e.d < 0) byBrand[e.brand] = (byBrand[e.brand] || 0) + -e.d; });
            const brandBars = Object.entries(byBrand).sort((a, b) => b[1] - a[1]).slice(0, 8)
                .map(([name, v]) => ({ name, v, extra: outUnits ? `(${Math.round(v / outUnits * 100)}%)` : '' }));

            // busiest weekdays
            const wd = [0, 0, 0, 0, 0, 0, 0];
            ev.forEach(e => { if (e.d < 0) wd[(e.t.getDay() + 6) % 7] += -e.d; });
            const wdBars = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map((name, k) => ({ name, v: wd[k] }));

            // who is updating
            const byUser = {};
            ev.forEach(e => {
                const u = e.user || 'Before logins';
                const x = (byUser[u] ||= { name: u, v: 0, out: 0, in: 0 });
                x.v++; if (e.d < 0) x.out += -e.d; else x.in += e.d;
            });
            const userBars = Object.values(byUser).sort((a, b) => b.v - a.v).slice(0, 8)
                .map(x => ({ name: x.name, v: x.v, extra: T('updates · {out} out, {in} in', { out: x.out, in: x.in }) }));

            // storeroom comparison (all storerooms only)
            let compare = '';
            if (!store) {
                const stores = FH.storeNames(items.map(i => i.storeroom));
                const cmp = stores.map(s => {
                    const its = items.filter(i => i.storeroom === s);
                    const se = ev.filter(e => e.storeroom === s);
                    const outs = {};
                    se.forEach(e => { if (e.d < 0) outs[tyreKey(e.brand, e.size)] = (outs[tyreKey(e.brand, e.size)] || 0) + -e.d; });
                    const best = Object.entries(outs).sort((a, b) => b[1] - a[1])[0];
                    return {
                        s,
                        lines: its.filter(i => i.qty > 0).length,
                        stock: its.reduce((a, i) => a + i.qty, 0),
                        out: se.reduce((a, e) => a + (e.d < 0 ? -e.d : 0), 0),
                        in: se.reduce((a, e) => a + (e.d > 0 ? e.d : 0), 0),
                        need: its.filter(i => ['low', 'out'].includes(FH.statusOf(i, lowDefault))).length,
                        best
                    };
                }).sort((a, b) => (FH.isShop(a.s) - FH.isShop(b.s)) || (b.out - a.out));
                compare = `<div class="panel">
                    <h2><i class="fas fa-warehouse"></i> Storerooms side by side <span class="sub">tap a row to see its stats</span></h2>
                    <div class="table-wrapper"><table class="cards">
                        <thead><tr><th>Storeroom</th><th class="num">Tyres on hand</th><th class="num">Lines in stock</th><th class="num">Taken out</th><th class="num">Added</th><th class="num">Need reorder</th><th>Most taken</th></tr></thead>
                        <tbody>${cmp.map(c => `<tr class="clickable" data-store="${esc(c.s)}">
                            <td data-label="Storeroom">${FH.storeTag(c.s)}</td>
                            <td data-label="On hand" class="num">${fmt(c.stock)}</td>
                            <td data-label="Lines" class="num">${c.lines}</td>
                            <td data-label="Taken out" class="num"><strong style="color:var(--red-soft)">${fmt(c.out)}</strong></td>
                            <td data-label="Added" class="num">${fmt(c.in)}</td>
                            <td data-label="Need reorder" class="num">${c.need ? `<span class="qty-badge low">${c.need}</span>` : '0'}</td>
                            <td data-label="Most taken">${c.best ? `${esc(c.best[0])} <span style="color:var(--faint)">(${c.best[1]})</span>` : '—'}</td>
                        </tr>`).join('')}</tbody>
                    </table></div>
                </div>`;
            }

            content.innerHTML = `
                <div class="kpis">
                    <div class="kpi"><div class="v">${fmt(outUnits)}</div><div class="l">Tyres taken out</div></div>
                    <div class="kpi good"><div class="v">${fmt(inUnits)}</div><div class="l">Tyres added</div></div>
                    <div class="kpi"><div class="v">${perDay < 10 ? perDay.toFixed(1) : fmt(perDay)}</div><div class="l">Taken out per day, on average</div></div>
                    <div class="kpi"><div class="v">${fmt(onHand)}</div><div class="l">Tyres on hand now</div></div>
                    <div class="kpi ${needOrder ? 'warn' : ''}"><div class="v">${needOrder}</div><div class="l">Lines low or out</div></div>
                    <div class="kpi"><div class="v">${slowTotal ? fmt(slowTotal) : 0}</div><div class="l">Tyres that didn't move</div></div>
                </div>

                <div class="panel">
                    <h2><i class="fas fa-chart-column"></i> Stock movement</h2>
                    ${dayChart(ev, days, since)}
                </div>

                ${compare}

                <div class="panel">
                    <h2><i class="fas fa-fire"></i> Most taken tyres</h2>
                    ${top.length ? `<div class="table-wrapper"><table class="cards">
                        <thead><tr><th>Tyre</th><th class="num">Taken out</th><th class="num">Times</th><th class="num">On hand</th><th>Stock lasts</th></tr></thead>
                        <tbody>${top.map((t, k) => `<tr>
                            <td data-label="Tyre"><span class="brand-tag">${esc(t.brand)}</span> <span class="size-tag">${esc(t.size)}</span></td>
                            <td data-label="Taken out" class="num"><strong style="color:var(--red-soft)">${t.out}</strong></td>
                            <td data-label="Times" class="num">${t.outTimes}</td>
                            <td data-label="On hand" class="num">${t.stock}</td>
                            <td data-label="Stock lasts"><span class="qty-badge ${t.cover != null && t.cover <= 7 ? 'out' : t.cover != null && t.cover <= 21 ? 'low' : ''}">${t.stock === 0 ? T('Out now') : coverText(t.cover)}</span></td>
                        </tr>`).join('')}</tbody>
                    </table></div>` : '<div class="empty">Nothing was taken out in this period.</div>'}
                    <p class="hint">"Stock lasts" is how long what's on hand would last at the rate it was taken out in this period.</p>
                </div>

                <div class="panel-grid">
                    <div class="panel">
                        <h2><i class="fas fa-hourglass-half"></i> Running out within 3 weeks</h2>
                        ${runningOut.length ? `<div class="hbars">${runningOut.map(t => `
                            <div class="hbar">
                                <span class="name" title="${esc(t.brand)} ${esc(t.size)}">${esc(t.brand)} ${esc(t.size)}</span>
                                <span class="sub-line" style="margin:0">${T('{n} left', { n: t.stock })} · ${t.rate < 1 ? T('{n}/week', { n: (t.rate * 7).toFixed(1) }) : T('{n}/day', { n: t.rate.toFixed(1) })}</span>
                                <span class="qty-badge ${t.stock === 0 ? 'out' : t.cover <= 7 ? 'out' : 'low'}">${t.stock === 0 ? T('Out now') : coverText(t.cover)}</span>
                            </div>`).join('')}</div>` : '<div class="empty">No fast-moving tyre is close to running out.</div>'}
                    </div>
                    <div class="panel">
                        <h2><i class="fas fa-snowflake"></i> Not moving <span class="sub">in stock, none taken out this period</span></h2>
                        ${slow.length ? `<div class="hbars">${slow.map(i => `
                            <div class="hbar">
                                <span class="name" title="${esc(i.brand)} ${esc(i.size)}">${esc(i.brand)} ${esc(i.size)}</span>
                                <span class="sub-line" style="margin:0">${store ? '' : esc(i.storeroom) + ' · '}${i.lastOut ? T('last taken {age}', { age: FH.ageText(i.lastOut) }) : T('never taken since tracking')}</span>
                                <span class="qty-badge idle">${i.qty}</span>
                            </div>`).join('')}</div>
                            <p class="hint">Consider moving these to a busier storeroom or running a special.</p>` : '<div class="empty">Every tyre in stock moved at least once.</div>'}
                    </div>
                </div>

                <div class="panel-grid">
                    <div class="panel">
                        <h2><i class="fas fa-tags"></i> Brands taken out</h2>
                        ${bars(brandBars)}
                    </div>
                    <div class="panel">
                        <h2><i class="fas fa-calendar-week"></i> Busiest days of the week</h2>
                        ${outUnits ? bars(wdBars) : '<div class="empty">No movements in this period.</div>'}
                    </div>
                </div>

                <div class="panel">
                    <h2><i class="fas fa-user-pen"></i> Who updated stock</h2>
                    ${bars(userBars)}
                </div>`;

            content.querySelectorAll('tr[data-store]').forEach(tr => tr.addEventListener('click', () => {
                storeSel.value = tr.dataset.store;
                render();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }));

            document.getElementById('trackNote').textContent = firstEver
                ? T('Based on updates since {date}', { date: FH.fmtDate(firstEver) }) + (trackedDays < days ? ' ' + T('(history is shorter than the period, so rates use {n} days)', { n: Math.round(trackedDays) }) : '')
                : T('No updates logged yet');
        }

        async function load() {
            try {
                const [inv, hist] = await Promise.all([FH.api('getInventory'), FH.api('getHistory')]);
                items = inv.items || [];
                lowDefault = Number(inv.lowDefault) || 0;
                FH.setStores(inv.stores, inv.moveFromFirst);
                // "not on system" additions were already on the shelf, so they aren't counted as stock added
                rows = (hist.rows || []).filter(r => r.type !== 'count')
                    .map(r => ({ ...r, t: FH.toDate(r.timestamp), d: parseInt(r.delta, 10) || 0 }));
                const ts = rows.map(r => r.t?.getTime()).filter(Boolean);
                firstEver = ts.length ? ts.reduce((a, b) => Math.min(a, b)) : null;

                const stores = FH.storeNames(items.map(i => i.storeroom).concat(rows.map(r => r.storeroom)));
                storeSel.innerHTML = '<option value="">All storerooms</option>' + FH.storeOptions(stores, '');
                const fromUrl = new URLSearchParams(location.search).get('store');
                if (fromUrl && stores.includes(fromUrl)) storeSel.value = fromUrl;
                render();
            } catch (err) {
                content.innerHTML = `<div class="info-box"><i class="fas fa-triangle-exclamation"></i>${T("Couldn't load stats: {msg}", { msg: esc(err.message) })}</div>`;
            }
        }

        storeSel.addEventListener('change', render);
        periodSel.addEventListener('change', render);
        load();
    })();
</script>
</body>
</html>
