<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firsthill · sign in</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body { display: flex; align-items: center; justify-content: center; }
        .login { max-width: 420px; width: 100%; padding: 34px 32px 30px; }
        .login h1 { color: var(--red-hi); font-size: 1.6rem; text-shadow: 0 0 8px #7a1a1a; display: flex; align-items: center; gap: 10px; }
        .login p.lead { color: var(--muted); font-size: 0.9rem; margin: 6px 0 24px; }
        .login .field { margin-bottom: 16px; }
        .login .btn { width: 100%; margin-top: 6px; }
        .login .msg { display: none; margin-bottom: 18px; }
        .login .msg.show { display: block; }
        .pw-wrap { position: relative; }
        .pw-wrap button { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: none; border: 0; color: var(--muted); cursor: pointer; padding: 6px; }
    </style>
</head>
<body>
<div class="app login">
    <h1><i class="fas fa-warehouse"></i> Firsthill</h1>
    <p class="lead">Sign in to manage tyre stock.</p>

    <div class="info-box msg" id="msg" role="alert"></div>

    <form id="loginForm" novalidate>
        <div class="field">
            <label for="username">Username</label>
            <input type="text" id="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </div>
        <div class="field">
            <label for="password">Password</label>
            <div class="pw-wrap">
                <input type="password" id="password" autocomplete="current-password" required>
                <button type="button" id="togglePw" aria-label="Show password"><i class="fas fa-eye"></i></button>
            </div>
        </div>
        <button type="submit" class="btn" id="loginBtn"><i class="fas fa-right-to-bracket"></i> Sign in</button>
    </form>
    <div class="footnote" style="text-align:center;">FirstHill (pty) ltd</div>
</div>

<script src="common.js"></script>
<script>
    (function () {
        const params = new URLSearchParams(location.search);
        const nextRaw = params.get('next') || 'index.html';
        const next = /^[a-z]+\.html$/i.test(nextRaw) && nextRaw !== 'login.html' ? nextRaw : 'index.html';

        const form = document.getElementById('loginForm');
        const userEl = document.getElementById('username');
        const pwEl = document.getElementById('password');
        const btn = document.getElementById('loginBtn');
        const msg = document.getElementById('msg');

        function showMsg(text) {
            msg.innerHTML = `<i class="fas fa-circle-exclamation"></i>${FH.esc(text)}`;
            msg.classList.add('show');
        }

        if (params.get('msg')) showMsg(params.get('msg'));

        // Already signed in? go straight in
        if (FH.user() && localStorage.getItem('fh_token') && !params.get('msg')) {
            location.replace(next);
            return;
        }

        document.getElementById('togglePw').addEventListener('click', () => {
            const show = pwEl.type === 'password';
            pwEl.type = show ? 'text' : 'password';
            document.querySelector('#togglePw i').className = show ? 'fas fa-eye-slash' : 'fas fa-eye';
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = userEl.value.trim();
            const password = pwEl.value;
            if (!username || !password) { showMsg('Enter your username and password.'); return; }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Signing in…';
            try {
                const res = await FH.api('login', { username, password });
                FH.setSession(res.token, res.user);
                location.replace(next);
            } catch (err) {
                showMsg(err.message);
                pwEl.value = '';
                pwEl.focus();
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-right-to-bracket"></i> Sign in';
            }
        });

        userEl.focus();
    })();
</script>
</body>
</html>
