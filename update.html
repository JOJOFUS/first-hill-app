<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firsthill · update quantity</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #1a0a0a;
            color: #f0e6e6;
            min-height: 100vh;
            padding: 24px;
        }
        .app {
            max-width: 720px;
            margin: 0 auto;
            background: #1f0f0f;
            border-radius: 32px;
            padding: 28px 30px 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7), 0 0 0 1px #4a1a1a;
            border: 1px solid #5e1e1e;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px 20px;
            margin-bottom: 28px;
            border-bottom: 2px solid #8b1e1e;
            padding-bottom: 20px;
        }
        .logo h1 {
            font-weight: 700;
            font-size: 1.6rem;
            letter-spacing: -0.5px;
            color: #ff4d4d;
            text-shadow: 0 0 8px #7a1a1a;
        }
        .logo i { color: #ff2a2a; margin-right: 8px; }
        .back-link {
            color: #dba8a8;
            font-size: 0.9rem;
            text-decoration: none;
            background: #2f1212;
            padding: 8px 16px;
            border-radius: 40px;
            border: 1px solid #661c1c;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.15s;
        }
        .back-link:hover { background: #3d1414; border-color: #982a2a; }
        .transfer-card {
            background: #1f0c0c;
            border-radius: 24px;
            padding: 20px 24px 24px;
            border: 1px solid #751f1f;
            box-shadow: 0 6px 12px rgba(0,0,0,0.5);
        }
        .transfer-card h3 {
            color: #ff5e5e;
            font-weight: 600;
            font-size: 1.3rem;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .transfer-card h3 i { color: #ff2a2a; }
        .transfer-grid {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 16px 20px;
        }
        .transfer-field {
            flex: 1 0 140px;
            min-width: 120px;
        }
        .transfer-field label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #b57474;
            margin-bottom: 4px;
            font-weight: 600;
        }
        .transfer-field select,
        .transfer-field input {
            width: 100%;
            padding: 10px 12px;
            background: #2e1212;
            border: 1px solid #681f1f;
            border-radius: 14px;
            color: #f0e0e0;
            font-weight: 500;
            font-size: 0.9rem;
            outline: none;
            transition: 0.2s;
        }
        .transfer-field select:focus,
        .transfer-field input:focus {
            border-color: #d43b3b;
            box-shadow: 0 0 0 3px #4f1515;
        }
        .transfer-field select option { background: #1c0a0a; color: #f0e0e0; }
        .btn-transfer {
            background: #b32828;
            border: none;
            color: white;
            font-weight: 700;
            padding: 10px 30px;
            border-radius: 40px;
            font-size: 1rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #d43b3b;
            transition: 0.15s;
            box-shadow: 0 4px 0 #621717;
            transform: translateY(-2px);
        }
        .btn-transfer:hover {
            background: #cc2f2f;
            box-shadow: 0 6px 0 #521212;
            transform: translateY(-3px);
        }
        .btn-transfer:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #521212;
        }
        .btn-transfer:disabled {
            opacity: 0.5;
            transform: translateY(0);
            box-shadow: 0 2px 0 #621717;
            pointer-events: none;
        }
        .current-qty-note {
            margin-top: 14px;
            font-size: 0.85rem;
            color: #dba8a8;
            background: #2b0f0f;
            border: 1px solid #601d1d;
            padding: 10px 14px;
            border-radius: 14px;
            display: none;
        }
        .current-qty-note.show { display: block; }
        .current-qty-note strong { color: #ff9b9b; }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #2b0f0f;
            border: 1px solid #d43b3b;
            color: #f0e0e0;
            padding: 14px 28px;
            border-radius: 60px;
            font-weight: 500;
            box-shadow: 0 8px 20px rgba(0,0,0,0.8);
            z-index: 999;
            display: none;
            backdrop-filter: blur(4px);
            max-width: 90%;
            text-align: center;
        }
        .toast.show { display: block; }
        .toast i { margin-right: 10px; color: #ff5e5e; }
        .footnote {
            margin-top: 20px;
            text-align: center;
            font-size: 0.75rem;
            color: #754a4a;
        }
        .footnote i { color: #b33b3b; }

        @media (max-width: 480px) {
            body { padding: 10px; }
            .app { padding: 16px 12px 28px; border-radius: 20px; }
            .header { flex-direction: column; align-items: start; }
            .transfer-card { padding: 16px 14px 18px; }
            .transfer-grid { flex-direction: column; align-items: stretch; }
            .transfer-field { min-width: 0; }
            .btn-transfer { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <div class="logo">
            <h1><i class="fas fa-warehouse"></i> Firsthill stock tracker</h1>
        </div>
        <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <a href="history.html" class="back-link"><i class="fas fa-clock-rotate-left"></i> history</a>
            <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> back to inventory</a>
        </div>
    </div>

    <div class="transfer-card">
        <h3><i class="fas fa-arrow-right-arrow-left"></i> UPDATE QUANTITY</h3>
        <div class="transfer-grid">
            <div class="transfer-field">
                <label><i class="fas fa-tag"></i> Brand</label>
                <select id="transferBrand"><option value="">— loading —</option></select>
            </div>
            <div class="transfer-field">
                <label><i class="fas fa-ruler"></i> Size</label>
                <select id="transferSize"><option value="">— select —</option></select>
            </div>
            <div class="transfer-field">
                <label><i class="fas fa-warehouse"></i> Warehouse</label>
                <select id="transferFrom"><option value="">— warehouse —</option></select>
            </div>
            <div class="transfer-field">
                <label><i class="fas fa-arrow-left"></i> Qty Change</label>
                <input type="number" id="transferQty" placeholder="+ add, - remove" value="1" min="-999" step="1">
            </div>
            <button class="btn-transfer" id="transferBtn"><i class="fas fa-pen-to-square"></i> UPDATE</button>
        </div>
        <div style="margin-top: 10px; font-size: 0.8rem; color: #9f5f5f;">
            <i class="fas fa-info-circle"></i>
            Enter positive number to add, negative to remove
        </div>
        <div class="current-qty-note" id="currentQtyNote"></div>
    </div>

    <div class="footnote"><i class="fas fa-cloud-upload-alt"></i> FirstHill (pty) ltd · live sync</div>
</div>

<div id="toast" class="toast"><i class="fas fa-check-circle"></i> <span id="toastMsg">done</span></div>

<script>
    (function() {
        // ---------- CONFIG ----------
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxOFw-d32X4bwpFN12weI1E3d02dCeedwpEKHbA3wK2ZLKnuOzzrf2-kaknkNNWD27tbQ/execttps://script.google.com/macros/s/AKfycbxlIzjVbRkcWdX9A1bpGooGvH-WNw9pyf8reqspeGPNRTQqe06EDEYrpOpRBN876HyHcQ/exec';
        const GOOGLE_SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQz7v74B9qEVB0RNbUqxwVMa5Yvnb2GxLPchxtz_8qyQyZWoT-Q0LIBb443JpvRxcKBXzHAzfaARfHG/pub?output=csv';

        let inventory = [];
        let isUpdating = false;

        const brandSelect = document.getElementById('transferBrand');
        const sizeSelect = document.getElementById('transferSize');
        const fromSelect = document.getElementById('transferFrom');
        const qtyInput = document.getElementById('transferQty');
        const transferBtn = document.getElementById('transferBtn');
        const currentQtyNote = document.getElementById('currentQtyNote');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');

        function showToast(msg, isError = false) {
            toastMsg.textContent = msg;
            toast.style.display = 'block';
            toast.style.borderColor = isError ? '#b33b3b' : '#43b33b';
            toast.querySelector('i').className = isError ? 'fas fa-exclamation-circle' : 'fas fa-check-circle';
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => { toast.style.display = 'none'; }, 4000);
        }

        function parseCSV(csvText) {
            const rows = [];
            let row = [], field = '', inQuotes = false;
            for (let i = 0; i < csvText.length; i++) {
                const ch = csvText[i];
                if (ch === '"') {
                    if (inQuotes && csvText[i + 1] === '"') { field += '"'; i++; }
                    else { inQuotes = !inQuotes; }
                } else if (ch === ',' && !inQuotes) {
                    row.push(field.trim());
                    field = '';
                } else if ((ch === '\n' || ch === '\r') && !inQuotes) {
                    if (ch === '\r' && csvText[i + 1] === '\n') i++;
                    row.push(field.trim());
                    field = '';
                    if (row.some(v => v !== '')) rows.push(row);
                    row = [];
                } else {
                    field += ch;
                }
            }
            if (field !== '' || row.length) {
                row.push(field.trim());
                if (row.some(v => v !== '')) rows.push(row);
            }
            if (rows.length < 2) return [];
            const headers = rows[0].map(h => h.trim());
            return rows.slice(1).map(values => {
                const obj = {};
                headers.forEach((h, idx) => {
                    let val = values[idx] ?? '';
                    if (h.toLowerCase() === 'qty') {
                        val = parseInt(String(val).replace(/,/g, ''), 10) || 0;
                    }
                    obj[h] = val;
                });
                const qtyKey = headers.find(h => h.toLowerCase() === 'qty');
                const brandKey = headers.find(h => h.toLowerCase() === 'brand');
                const sizeKey = headers.find(h => h.toLowerCase() === 'size');
                const storeKey = headers.find(h =>
                    ['storeroom', 'store room', 'warehouse', 'location'].includes(h.toLowerCase())
                );
                return {
                    Brand: brandKey ? obj[brandKey] : '',
                    Size: sizeKey ? obj[sizeKey] : '',
                    QTY: qtyKey ? Number(obj[qtyKey]) || 0 : 0,
                    Storeroom: storeKey ? obj[storeKey] : ''
                };
            }).filter(item => item.Brand || item.Size || item.Storeroom);
        }

        function populateSelects() {
            const brandSet = new Set(inventory.map(i => i.Brand));
            const currentBrand = brandSelect.value;
            brandSelect.innerHTML = '<option value="">— brand —</option>' +
                Array.from(brandSet).sort().map(b => `<option value="${b}">${b}</option>`).join('');
            if (currentBrand && brandSet.has(currentBrand)) brandSelect.value = currentBrand;

            const selectedBrand = brandSelect.value;
            const sizeSet = new Set();
            inventory.forEach(i => {
                if (selectedBrand === '' || i.Brand === selectedBrand) sizeSet.add(i.Size);
            });
            const currentSize = sizeSelect.value;
            sizeSelect.innerHTML = '<option value="">— size —</option>' +
                Array.from(sizeSet).sort().map(s => `<option value="${s}">${s}</option>`).join('');
            if (currentSize && sizeSet.has(currentSize)) sizeSelect.value = currentSize;

            const whSet = new Set(inventory.map(i => i.Storeroom));
            const currentFrom = fromSelect.value;
            fromSelect.innerHTML = '<option value="">— warehouse —</option>' +
                Array.from(whSet).sort().map(w => `<option value="${w}">${w}</option>`).join('');
            if (currentFrom && whSet.has(currentFrom)) fromSelect.value = currentFrom;

            updateCurrentQtyNote();
        }

        function updateCurrentQtyNote() {
            const brand = brandSelect.value;
            const size = sizeSelect.value;
            const wh = fromSelect.value;
            if (!brand || !size || !wh) {
                currentQtyNote.classList.remove('show');
                return;
            }
            const item = inventory.find(i => i.Brand === brand && i.Size === size && i.Storeroom === wh);
            if (item) {
                currentQtyNote.innerHTML = `<i class="fas fa-circle-info"></i> Current QTY of <strong>${brand} ${size}</strong> in <strong>${wh}</strong>: <strong>${item.QTY}</strong>`;
            } else {
                currentQtyNote.innerHTML = `<i class="fas fa-triangle-exclamation"></i> No existing entry for this combination — an UPDATE will create a new row.`;
            }
            currentQtyNote.classList.add('show');
        }

        async function writeRowToSheet(brand, size, storeroom, newQty, delta) {
            try {
                const formData = new URLSearchParams();
                formData.append('action', 'updateQty');
                formData.append('brand', brand || '');
                formData.append('size', size || '');
                formData.append('storeroom', storeroom || '');
                formData.append('qty', String(parseInt(newQty, 10) || 0));
                formData.append('delta', String(parseInt(delta, 10) || 0));

                const response = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: formData.toString()
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const result = await response.json();

                if (result.status !== 'success') {
                    throw new Error(result.message || 'Apps Script reported an error');
                }

                showToast('✅ Update sent to Google Sheet');
                return true;
            } catch (e) {
                console.error('Write error:', e);
                showToast('❌ Failed to update: ' + e.message, true);
                return false;
            }
        }

        async function performTransfer() {
            if (isUpdating) return;

            const brand = brandSelect.value;
            const size = sizeSelect.value;
            const fromWh = fromSelect.value;
            const qtyDelta = parseInt(qtyInput.value, 10);

            if (!brand || !size || !fromWh) {
                showToast('Please select Brand, Size and Warehouse.', true);
                return;
            }
            if (isNaN(qtyDelta) || qtyDelta === 0) {
                showToast('Enter a valid quantity (positive to add, negative to remove).', true);
                return;
            }

            const index = inventory.findIndex(item =>
                item.Brand === brand && item.Size === size && item.Storeroom === fromWh
            );

            const currentQty = index === -1 ? 0 : inventory[index].QTY;
            const newQty = currentQty + qtyDelta;
            if (newQty < 0) {
                showToast(`❌ Cannot go below 0. Current: ${currentQty}`, true);
                return;
            }

            isUpdating = true;
            transferBtn.disabled = true;
            transferBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> syncing…';

            const success = await writeRowToSheet(brand, size, fromWh, newQty, qtyDelta);

            if (success) {
                if (index === -1) {
                    inventory.push({ Brand: brand, Size: size, Storeroom: fromWh, QTY: newQty });
                } else {
                    inventory[index].QTY = newQty;
                }
                populateSelects();
                showToast(`✅ ${brand} ${size} in ${fromWh}: ${currentQty} → ${newQty}`);
            } else {
                showToast('❌ Update failed, changes not saved.', true);
            }

            isUpdating = false;
            transferBtn.disabled = false;
            transferBtn.innerHTML = '<i class="fas fa-pen-to-square"></i> UPDATE';
        }

        async function loadInventoryFromGoogleSheet() {
            try {
                const response = await fetch(GOOGLE_SHEET_CSV_URL, { cache: 'no-store' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const csvText = await response.text();
                const parsed = parseCSV(csvText);
                if (!parsed.length) throw new Error('No data rows found.');
                inventory = parsed;
                populateSelects();
            } catch (error) {
                console.error('Load error:', error);
                inventory = [];
                brandSelect.innerHTML = '<option value="">— failed to load —</option>';
                showToast('❌ Failed to load sheet data: ' + error.message, true);
            }
        }

        function init() {
            loadInventoryFromGoogleSheet();
            transferBtn.addEventListener('click', performTransfer);
            brandSelect.addEventListener('change', populateSelects);
            sizeSelect.addEventListener('change', updateCurrentQtyNote);
            fromSelect.addEventListener('change', updateCurrentQtyNote);
        }

        init();
    })();
</script>

<!--
    ============================================================
    GOOGLE APPS SCRIPT (paste this into Extensions > Apps Script
    on the Google Sheet, then Deploy > New deployment > Web app.
    Redeploy — "Manage deployments" > pencil icon > New version —
    after pasting this updated version, so the /exec URL picks up
    the History logging and the new doGet handler.)
    ============================================================

    Deploy settings:
      - Execute as: Me
      - Who has access: Anyone
    Then copy the resulting /exec URL into APPS_SCRIPT_URL above
    (used on update.html AND history.html).

    Note: these pages fetch this WITHOUT mode:'no-cors', so they can read
    the real JSON response. Apps Script Web Apps allow this for simple
    GET requests and simple POST requests (form-urlencoded body, no
    custom headers) without any extra CORS config needed on your end.

    This version also writes every change to a "History" tab
    (auto-created on first update) with columns:
    Timestamp | Brand | Size | Storeroom | Change | NewQty

    function doPost(e) {
      try {
        const params = e.parameter || {};

        if (params.action !== 'updateQty') {
          throw new Error('Unknown or missing action: ' + params.action);
        }

        const brand = (params.brand || '').trim();
        const size = (params.size || '').trim();
        const storeroom = (params.storeroom || '').trim();
        const qty = parseInt(params.qty, 10);
        const delta = params.delta !== undefined ? parseInt(params.delta, 10) : 0;

        if (!brand || !size || !storeroom || isNaN(qty)) {
          throw new Error('Missing or invalid fields: ' + JSON.stringify(params));
        }

        const ss = SpreadsheetApp.getActiveSpreadsheet();
        const SHEET_NAME = 'First hill app.xlsx';
        const sheet = ss.getSheetByName(SHEET_NAME);
        if (!sheet) {
          throw new Error('Sheet tab not found: "' + SHEET_NAME + '". Available tabs: ' +
            ss.getSheets().map(s => s.getName()).join(', '));
        }

        const values = sheet.getDataRange().getValues();
        const headers = values[0].map(h => String(h).trim().toLowerCase());

        const brandCol = headers.indexOf('brand');
        const sizeCol = headers.indexOf('size');
        const qtyCol = headers.indexOf('qty');
        const storeCol = headers.findIndex(h =>
          ['storeroom', 'store room', 'warehouse', 'location'].includes(h)
        );

        if (brandCol === -1 || sizeCol === -1 || qtyCol === -1 || storeCol === -1) {
          throw new Error('Could not find required columns in headers: ' + headers.join(', '));
        }

        let rowIndex = -1;
        for (let i = 1; i < values.length; i++) {
          if (
            String(values[i][brandCol]).trim() === brand &&
            String(values[i][sizeCol]).trim() === size &&
            String(values[i][storeCol]).trim() === storeroom
          ) {
            rowIndex = i;
            break;
          }
        }

        let action;
        if (rowIndex === -1) {
          const newRow = [];
          newRow[brandCol] = brand;
          newRow[sizeCol] = size;
          newRow[qtyCol] = qty;
          newRow[storeCol] = storeroom;
          sheet.appendRow(newRow);
          action = 'inserted';
        } else {
          sheet.getRange(rowIndex + 1, qtyCol + 1).setValue(qty);
          action = 'updated';
        }

        logHistory_(ss, brand, size, storeroom, delta, qty);

        return ContentService
          .createTextOutput(JSON.stringify({ status: 'success', action: action }))
          .setMimeType(ContentService.MimeType.JSON);

      } catch (error) {
        return ContentService
          .createTextOutput(JSON.stringify({ status: 'error', message: error.toString() }))
          .setMimeType(ContentService.MimeType.JSON);
      }
    }

    function logHistory_(ss, brand, size, storeroom, delta, newQty) {
      const HISTORY_SHEET_NAME = 'History';
      let hist = ss.getSheetByName(HISTORY_SHEET_NAME);
      if (!hist) {
        hist = ss.insertSheet(HISTORY_SHEET_NAME);
        hist.appendRow(['Timestamp', 'Brand', 'Size', 'Storeroom', 'Change', 'NewQty']);
      }
      hist.appendRow([new Date(), brand, size, storeroom, delta, newQty]);
    }

    function doGet(e) {
      try {
        const params = e.parameter || {};
        if (params.action !== 'getHistory') {
          throw new Error('Unknown or missing action: ' + params.action);
        }

        const ss = SpreadsheetApp.getActiveSpreadsheet();
        const hist = ss.getSheetByName('History');
        if (!hist) {
          return ContentService
            .createTextOutput(JSON.stringify({ status: 'success', rows: [] }))
            .setMimeType(ContentService.MimeType.JSON);
        }

        const values = hist.getDataRange().getValues();
        const rows = values.slice(1).map(r => ({
          timestamp: r[0] instanceof Date ? r[0].toISOString() : String(r[0]),
          brand: r[1],
          size: r[2],
          storeroom: r[3],
          delta: r[4],
          newQty: r[5]
        })).reverse(); // most recent first

        return ContentService
          .createTextOutput(JSON.stringify({ status: 'success', rows: rows }))
          .setMimeType(ContentService.MimeType.JSON);

      } catch (error) {
        return ContentService
          .createTextOutput(JSON.stringify({ status: 'error', message: error.toString() }))
          .setMimeType(ContentService.MimeType.JSON);
      }
    }
