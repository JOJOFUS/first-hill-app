<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firsthill · update quantity</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .mode-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; }
        .new-link { background: none; border: 0; color: var(--soft); font-size: 0.82rem; cursor: pointer; text-decoration: underline; padding: 0; margin-top: 10px; }
        .new-link:hover { color: #fff; }
        .qty-wrap { display: flex; align-items: stretch; gap: 6px; }
        .qty-wrap input { text-align: center; }
        .qty-wrap button {
            background: var(--field); border: 1px solid var(--line-3); color: var(--soft);
            border-radius: 12px; width: 42px; flex-shrink: 0; cursor: pointer; font-size: 1rem;
        }
        .qty-wrap button:hover { border-color: #982a2a; color: #fff; }
        #submitBtn.mode-in { background: #1f7a3c; border-color: #2fae5a; box-shadow: 0 4px 0 #0f3d1e; }
        #submitBtn.mode-in:hover { background: #24904a; }
        #submitBtn.mode-count { background: #3d338a; border-color: #6a5ed0; box-shadow: 0 4px 0 #1f1a4a; }
        #submitBtn.mode-count:hover { background: #4a3fa3; }
        @media (max-width: 520px) { .seg { display: flex; flex-wrap: wrap; } .seg button { flex: 1 0 auto; justify-content: center; } }
    </style>
</head>
<body>
<div class="app narrow">
    <div id="fhNav"></div>

    <div class="page-head">
        <div>
            <h1>Update quantity</h1>
            <p id="modeHelp">Pick the storeroom first. Only tyres in that storeroom are listed.</p>
        </div>
    </div>

    <div class="panel">
        <div class="mode-row">
            <div class="seg" role="group" aria-label="Type of update">
                <button type="button" id="modeOut" class="on-out"><i class="fas fa-arrow-up-from-bracket"></i> Take out</button>
                <button type="button" id="modeIn"><i class="fas fa-truck-ramp-box"></i> Add stock</button>
                <button type="button" id="modeCount"><i class="fas fa-clipboard-check"></i> Not on system</button>
            </div>
        </div>

        <div class="form-grid">
            <div class="field">
                <label for="storeSel"><i class="fas fa-warehouse"></i> Storeroom</label>
                <select id="storeSel"><option value="">Loading…</option></select>
            </div>
            <div class="field" id="brandField">
                <label for="brandSel"><i class="fas fa-tag"></i> Brand</label>
                <select id="brandSel" disabled><option value="">Choose a storeroom first</option></select>
            </div>
            <div class="field" id="sizeField">
                <label for="sizeSel"><i class="fas fa-ruler"></i> Size</label>
                <select id="sizeSel" disabled><option value="">—</option></select>
            </div>
        </div>

        <div class="form-grid" id="newTyreFields" style="display:none; margin-top:14px;">
            <div class="field">
                <label for="newBrand" id="newBrandLabel"><i class="fas fa-tag"></i> Brand (new to this storeroom)</label>
                <input type="text" id="newBrand" list="brandList" autocomplete="off" placeholder="e.g. Bridgestone">
            </div>
            <div class="field">
                <label for="newSize"><i class="fas fa-ruler"></i> Size</label>
                <input type="text" id="newSize" list="sizeList" autocomplete="off" placeholder="e.g. 205/55R16">
            </div>
        </div>
        <datalist id="brandList"></datalist>
        <datalist id="sizeList"></datalist>
        <button type="button" class="new-link" id="newToggle" style="display:none;">Adding a tyre this storeroom doesn't have yet?</button>

        <div class="form-grid" style="margin-top:16px;">
            <div class="field">
                <label for="qtyInput" id="qtyLabel">How many tyres are you taking out?</label>
                <div class="qty-wrap">
                    <button type="button" id="minusBtn" aria-label="One less">−</button>
                    <input type="number" id="qtyInput" value="1" min="1" step="1" inputmode="numeric">
                    <button type="button" id="plusBtn" aria-label="One more">+</button>
                </div>
            </div>
            <button type="button" class="btn" id="submitBtn" style="flex:1 0 180px;"><i class="fas fa-arrow-up-from-bracket"></i> Take out</button>
        </div>

        <div id="infoArea"></div>
    </div>

    <div id="resultArea"></div>
    <div class="footnote">FirstHill (pty) ltd · live sync</div>
</div>

<script src="i18n.js"></script>
<script src="common.js"></script>
<script>
    (function () {
        const me = FH.requireLogin('update.html');
        if (!me) return;
        const esc = FH.esc, t = FH.t, tp = FH.tp;
        const LAST_STORE_KEY = 'fh_last_store';

        let items = [];
        let lowDefault = 4;
        let mode = 'out';           // 'out' = take out, 'in' = add stock (delivery), 'count' = stock on the shelf that isn't on the system
        let newTyre = false;        // typing a brand/size that isn't in this storeroom yet
        let busy = false;

        const $ = id => document.getElementById(id);
        const storeSel = $('storeSel'), brandSel = $('brandSel'), sizeSel = $('sizeSel');
        const newBrand = $('newBrand'), newSize = $('newSize');
        const qtyInput = $('qtyInput'), submitBtn = $('submitBtn');
        const infoArea = $('infoArea'), resultArea = $('resultArea');

        function opt(value, label, selected) {
            return `<option value="${esc(value)}" ${selected ? 'selected' : ''}>${esc(label)}</option>`;
        }

        // items in the chosen storeroom that can be picked in this mode
        function pickable() {
            const s = storeSel.value;
            if (!s) return [];
            return items.filter(i => i.storeroom === s && (mode === 'in' || i.qty > 0));
        }

        function fillStores() {
            const stores = FH.storeNames(items.map(i => i.storeroom));
            let current = storeSel.value;
            if (!current) { try { current = localStorage.getItem(LAST_STORE_KEY) || ''; } catch (e) {} }
            if (!stores.length) {
                storeSel.innerHTML = opt('', me.role === 'admin' ? 'No storerooms yet' : 'No shops assigned to you yet');
                storeSel.disabled = true;
                return;
            }
            storeSel.disabled = false;
            storeSel.innerHTML = opt('', '— choose storeroom —') + FH.storeOptions(stores, current, s => {
                const n = items.filter(i => i.storeroom === s && i.qty > 0).length;
                return `${s}  (${tp(n, '{n} tyre line', '{n} tyre lines')})`;
            });
        }

        function fillBrands() {
            const list = pickable();
            const current = brandSel.value;
            if (!storeSel.value) {
                brandSel.disabled = true;
                brandSel.innerHTML = opt('', 'Choose a storeroom first');
                return;
            }
            const brands = [...new Set(list.map(i => i.brand))].sort(FH.naturalSort);
            brandSel.disabled = brands.length === 0;
            brandSel.innerHTML = brands.length
                ? opt('', '— brand —') + brands.map(b => {
                    const total = list.filter(i => i.brand === b).reduce((a, i) => a + i.qty, 0);
                    return opt(b, `${b}  (${total})`, b === current);
                }).join('')
                : opt('', mode === 'out' ? 'Nothing in stock here' : 'No tyres here yet');
        }

        function fillSizes() {
            const b = brandSel.value;
            const current = sizeSel.value;
            if (!b) { sizeSel.disabled = true; sizeSel.innerHTML = opt('', '—'); return; }
            const list = pickable().filter(i => i.brand === b).sort((x, y) => FH.naturalSort(x.size, y.size));
            sizeSel.disabled = false;
            sizeSel.innerHTML = opt('', '— size —') + list.map(i => {
                const st = FH.statusOf(i, lowDefault);
                const flag = st === 'out' ? ' · ' + t('out') : st === 'low' ? ' · ' + t('low') : '';
                return opt(i.size, `${i.size}  —  ${t('{n} in stock', { n: i.qty })}${flag}`, i.size === current);
            }).join('');
            if (list.length === 1 && !sizeSel.value) sizeSel.value = list[0].size;
        }

        function fillDatalists() {
            const brands = [...new Set(items.map(i => i.brand))].sort(FH.naturalSort);
            $('brandList').innerHTML = brands.map(b => `<option value="${esc(b)}">`).join('');
            const b = newBrand.value.trim().toLowerCase();
            const sizes = [...new Set(items.filter(i => !b || i.brand.toLowerCase() === b).map(i => i.size))].sort(FH.naturalSort);
            $('sizeList').innerHTML = sizes.map(s => `<option value="${esc(s)}">`).join('');
        }

        function refreshAll() {
            fillStores(); fillBrands(); fillSizes(); fillDatalists();
            updateInfo();
        }

        function selection() {
            const store = storeSel.value;
            const brand = newTyre ? newBrand.value.trim() : brandSel.value;
            const size = newTyre ? newSize.value.trim() : sizeSel.value;
            const item = items.find(i => i.storeroom === store && i.brand.toLowerCase() === brand.toLowerCase() && String(i.size).toLowerCase() === size.toLowerCase());
            return { store, brand: item ? item.brand : brand, size: item ? item.size : size, item };
        }

        const SUBMIT_LABEL = {
            out: '<i class="fas fa-arrow-up-from-bracket"></i> Take out',
            in: '<i class="fas fa-truck-ramp-box"></i> Add stock',
            count: '<i class="fas fa-clipboard-check"></i> Add to system'
        };

        function setMode(m) {
            mode = m;
            $('modeOut').className = m === 'out' ? 'on-out' : '';
            $('modeIn').className = m === 'in' ? 'on-in' : '';
            $('modeCount').className = m === 'count' ? 'on-count' : '';
            $('qtyLabel').textContent = m === 'out' ? 'How many tyres are you taking out?'
                : m === 'in' ? 'How many tyres arrived?' : 'How many are on the shelf that the system doesn\'t know about?';
            $('modeHelp').textContent = m === 'count'
                ? "Add tyres that are physically in a storeroom but missing from the system. Type any brand and size, even one the system has never seen. They're recorded as existing stock, not as a new delivery."
                : 'Pick the storeroom first. Only tyres in that storeroom are listed.';
            submitBtn.classList.toggle('mode-in', m === 'in');
            submitBtn.classList.toggle('mode-count', m === 'count');
            submitBtn.innerHTML = SUBMIT_LABEL[m];
            setNewTyre(m === 'count', true);
            $('newToggle').style.display = m === 'in' ? '' : 'none';
            fillBrands(); fillSizes(); updateInfo();
        }

        function setNewTyre(on, quiet) {
            newTyre = on;
            $('newTyreFields').style.display = on ? '' : 'none';
            $('brandField').style.display = on ? 'none' : '';
            $('sizeField').style.display = on ? 'none' : '';
            $('newBrandLabel').innerHTML = mode === 'count'
                ? '<i class="fas fa-tag"></i> Brand'
                : '<i class="fas fa-tag"></i> Brand (new to this storeroom)';
            $('newToggle').textContent = on ? 'Pick from tyres already in this storeroom instead' : "Adding a tyre this storeroom doesn't have yet?";
            if (on && !quiet) newBrand.focus();
            updateInfo();
        }

        // ---------- info / FIFO hints ----------
        function batchText(i) {
            if (i.qty <= 0) return '';
            if (i.untracked > 0 && i.untracked >= i.qty) return t("All {n} were already here before tracking started, so there's no delivery date for them yet. Take the oldest-looking ones (check the DOT date on the sidewall).", { n: i.qty });
            if (i.untracked > 0) return t('{a} of these {b} were here before tracking started — take those first.', { a: i.untracked, b: i.qty });
            if (i.oldestIn) return tp(i.oldestQty,
                'Oldest batch here arrived <strong>{date}</strong> ({age}) — {n} tyre left from it. Take those first.',
                'Oldest batch here arrived <strong>{date}</strong> ({age}) — {n} tyres left from it. Take those first.',
                { date: FH.fmtDate(i.oldestIn), age: FH.ageText(i.oldestIn) });
            return '';
        }

        function updateInfo() {
            const { store, brand, size, item } = selection();
            if (!store || !brand || !size) { infoArea.innerHTML = ''; return; }

            let html = '';
            if (mode === 'count') {
                const known = items.some(i => i.brand.toLowerCase() === brand.toLowerCase() && String(i.size).toLowerCase() === size.toLowerCase());
                html += item
                    ? `<div class="info-box"><i class="fas fa-circle-info"></i>${t('The system has <strong>{n}</strong> × {tyre} in {store}. What you add here goes on top of that.', { n: item.qty, tyre: esc(item.brand + ' ' + item.size), store: esc(store) })}</div>`
                    : `<div class="info-box"><i class="fas fa-circle-plus"></i>${t(known ? "<strong>{tyre}</strong> isn't on the system in {store}. This will create a new line."
                                                                                       : "<strong>{tyre}</strong> isn't on the system in {store} (or anywhere else). This will create a new line.", { tyre: esc(brand + ' ' + size), store: esc(store) })}</div>`;
                html += `<div class="info-box good"><i class="fas fa-clipboard-check"></i>These count as stock that was already on the shelf, so they show as the oldest stock and won't appear as a delivery today.</div>`;
            } else if (!item) {
                html += `<div class="info-box"><i class="fas fa-circle-plus"></i>${t("<strong>{tyre}</strong> isn't in {store} yet. Adding stock will create a new line.", { tyre: esc(brand + ' ' + size), store: esc(store) })}</div>`;
            } else {
                const st = FH.statusOf(item, lowDefault);
                const level = FH.levelOf(item, lowDefault);
                html += `<div class="info-box"><i class="fas fa-circle-info"></i>${t('{store} has <strong>{n}</strong> × {tyre}.', { store: esc(store), n: item.qty, tyre: esc(item.brand + ' ' + item.size) })}` +
                    (st === 'low' ? ' ' + t('<strong style="color:var(--warn)">Low stock</strong> (alert at {n}).', { n: level }) : '') +
                    (st === 'out' ? ' ' + t('<strong style="color:var(--bad)">Out of stock.</strong>') : '') +
                    (item.lastIn ? ' ' + t('Last delivery {date}.', { date: FH.fmtDate(item.lastIn) }) : '') + `</div>`;

                if (mode === 'out' && item.qty > 0) {
                    const bt = batchText(item);
                    if (bt) html += `<div class="info-box good"><i class="fas fa-layer-group"></i>${bt}</div>`;

                    // older stock of the same tyre in another storeroom?
                    const mine = FH.oldestTs(item);
                    const older = items
                        .filter(o => o !== item && o.qty > 0 && o.brand === item.brand && o.size === item.size && FH.oldestTs(o) < mine)
                        .sort((a, b) => FH.oldestTs(a) - FH.oldestTs(b));
                    if (older.length) {
                        const o = older[0];
                        const when = o.untracked > 0 ? t('from before tracking') : t('since {date}', { date: FH.fmtDate(o.oldestIn) });
                        html += `<div class="info-box warn"><i class="fas fa-triangle-exclamation"></i>${t('<strong>{store}</strong> has older stock of this tyre ({n} on hand, {when}). If you can, take from {store} first.', { store: esc(o.storeroom), n: o.qty, when })}</div>`;
                    }
                }
            }
            infoArea.innerHTML = html;
        }

        // ---------- submit ----------
        async function submit() {
            if (busy) return;
            const { store, brand, size, item } = selection();
            const n = parseInt(qtyInput.value, 10);

            if (!store) return FH.toast('Choose a storeroom.', true);
            if (!brand || !size) return FH.toast(newTyre ? 'Type the brand and size.' : 'Choose a brand and size.', true);
            if (!n || n < 1) return FH.toast('Enter how many tyres (1 or more).', true);
            if (mode === 'out') {
                const have = item ? item.qty : 0;
                if (n > have) return FH.toast(t("Only {have} in {store}. You can't take out {n}.", { have, store, n }), true);
            }

            busy = true;
            submitBtn.disabled = true;
            const label = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Saving…';
            try {
                const delta = mode === 'out' ? -n : n;
                const res = await FH.api('updateQty', { brand, size, storeroom: store, delta, kind: mode === 'count' ? 'count' : '' });
                const vars = { n, tyre: esc(brand + ' ' + size), store: esc(store), from: res.previousQty, to: res.newQty };
                const done = mode === 'out' ? t('Took {n} out of <strong>{tyre}</strong> in {store}: {from} → <strong>{to}</strong>.', vars)
                    : mode === 'count' ? tp(n, 'Added {n} existing tyre to the system for <strong>{tyre}</strong> in {store}: {from} → <strong>{to}</strong>.',
                                            'Added {n} existing tyres to the system for <strong>{tyre}</strong> in {store}: {from} → <strong>{to}</strong>.', vars)
                    : t('Added {n} to <strong>{tyre}</strong> in {store}: {from} → <strong>{to}</strong>.', vars);
                const after = { qty: res.newQty, min: item ? item.min : null };
                const st = FH.statusOf(after, lowDefault);
                resultArea.innerHTML = `<div class="info-box ${st === 'ok' ? 'good' : 'warn'}" style="margin:0 0 22px;">
                    <i class="fas fa-circle-check"></i>${done}
                    ${st === 'low' ? ' ' + t('This tyre is now <strong>low on stock</strong>.') : ''}${st === 'out' ? ' ' + t('This tyre is now <strong>out of stock</strong> here.') : ''}
                </div>`;
                FH.toast('Saved');
                qtyInput.value = 1;
                if (newTyre && mode !== 'count') { setNewTyre(false); }
                if (mode === 'count') { newBrand.value = ''; newSize.value = ''; }
                await load(true, { brand, size });
            } catch (err) {
                FH.toast(err.message, true);
            } finally {
                busy = false;
                submitBtn.disabled = false;
                submitBtn.innerHTML = label;
            }
        }

        async function load(keepSelection, select) {
            try {
                const data = await FH.api('getInventory');
                items = data.items || [];
                lowDefault = Number(data.lowDefault) || 0;
                FH.setStores(data.stores, data.moveFromFirst);
                refreshAll();
                if (keepSelection && select) {
                    if ([...brandSel.options].some(o => o.value === select.brand)) { brandSel.value = select.brand; fillSizes(); }
                    if ([...sizeSel.options].some(o => o.value === select.size)) sizeSel.value = select.size;
                    updateInfo();
                }
            } catch (err) {
                storeSel.innerHTML = opt('', 'Failed to load');
                FH.toast(t("Couldn't load stock: {msg}", { msg: err.message }), true);
            }
        }

        // ---------- events ----------
        $('modeOut').addEventListener('click', () => setMode('out'));
        $('modeIn').addEventListener('click', () => setMode('in'));
        $('modeCount').addEventListener('click', () => setMode('count'));
        $('newToggle').addEventListener('click', () => setNewTyre(!newTyre));
        storeSel.addEventListener('change', () => {
            try { localStorage.setItem(LAST_STORE_KEY, storeSel.value); } catch (e) {}
            brandSel.value = ''; fillBrands(); fillSizes(); updateInfo();
            resultArea.innerHTML = '';
        });
        brandSel.addEventListener('change', () => { sizeSel.value = ''; fillSizes(); updateInfo(); });
        sizeSel.addEventListener('change', updateInfo);
        newBrand.addEventListener('input', () => { fillDatalists(); updateInfo(); });
        newSize.addEventListener('input', updateInfo);
        $('minusBtn').addEventListener('click', () => { qtyInput.value = Math.max(1, (parseInt(qtyInput.value, 10) || 1) - 1); });
        $('plusBtn').addEventListener('click', () => { qtyInput.value = (parseInt(qtyInput.value, 10) || 0) + 1; });
        submitBtn.addEventListener('click', submit);
        qtyInput.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });

        setMode('out');
        load();
    })();
</script>
</body>
</html>
