<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firsthill · update history</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
    <div id="fhNav"></div>

    <div class="page-head">
        <div>
            <h1>Update history</h1>
            <p>Every change to stock, newest first.</p>
        </div>
    </div>

    <div class="toolbar">
        <div class="chips" id="typeChips">
            <button type="button" class="chip active" data-type="all">All changes</button>
            <button type="button" class="chip" data-type="in"><i class="fas fa-arrow-down"></i> Stock added</button>
            <button type="button" class="chip" data-type="out"><i class="fas fa-arrow-up"></i> Stock taken out</button>
            <button type="button" class="chip" data-type="count"><i class="fas fa-clipboard-check"></i> Added, not on system</button>
        </div>
        <label style="font-size:0.82rem; color:var(--muted);">Storeroom
            <select id="storeSel"><option value="">All</option></select>
        </label>
    </div>

    <div class="search-bar">
        <i class="fas fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Search brand, size, storeroom or person…" autocomplete="off">
        <i class="fas fa-circle-xmark clear-search" id="clearSearch" role="button" aria-label="Clear search"></i>
    </div>
    <div class="count-note" id="countNote" style="display:none;"></div>

    <div class="table-wrapper">
        <table class="cards">
            <thead><tr><th>Date &amp; time</th><th>Brand</th><th>Size</th><th>Storeroom</th><th>Change</th><th>New qty</th><th>By</th></tr></thead>
            <tbody id="tableBody">
                <tr class="empty-row"><td colspan="7"><i class="fas fa-spinner fa-pulse"></i> Loading history…</td></tr>
            </tbody>
        </table>
    </div>
    <div class="hint" id="moreNote" style="display:none;"></div>
    <div class="footnote">FirstHill (pty) ltd · update log</div>
</div>

<script src="i18n.js"></script>
<script src="common.js"></script>
<script>
    (function () {
        const me = FH.requireLogin('history.html');
        if (!me) return;
        const esc = FH.esc, t = FH.t;
        const PAGE = 300;

        let history = [];
        let query = '';
        let type = 'all';
        let shown = PAGE;

        const tbody = document.getElementById('tableBody');
        const searchInput = document.getElementById('searchInput');
        const clearSearch = document.getElementById('clearSearch');
        const countNote = document.getElementById('countNote');
        const storeSel = document.getElementById('storeSel');
        const moreNote = document.getElementById('moreNote');

        function filtered() {
            const store = storeSel.value;
            const q = query.toLowerCase();
            return history.filter(h => {
                const d = parseInt(h.delta, 10) || 0;
                if (type === 'in' && (d <= 0 || h.type === 'count')) return false;
                if (type === 'count' && h.type !== 'count') return false;
                if (type === 'out' && d >= 0) return false;
                if (store && h.storeroom !== store) return false;
                if (q && ![h.brand, h.size, h.storeroom, h.user].some(v => String(v ?? '').toLowerCase().includes(q))) return false;
                return true;
            });
        }

        function render() {
            if (!history.length) {
                tbody.innerHTML = `<tr class="empty-row"><td colspan="7"><i class="fas fa-inbox"></i> No updates logged yet. Changes made on the Update page will appear here.</td></tr>`;
                return;
            }
            const list = filtered();
            const active = query || type !== 'all' || storeSel.value;
            countNote.style.display = active ? 'block' : 'none';
            if (active) {
                const outN = list.reduce((a, h) => a + Math.max(0, -(parseInt(h.delta, 10) || 0)), 0);
                const inN = list.reduce((a, h) => a + Math.max(0, parseInt(h.delta, 10) || 0), 0);
                countNote.textContent = t('{a} of {b} entries · {in} tyres added, {out} taken out', { a: list.length, b: history.length, in: inN, out: outN });
            }
            if (!list.length) {
                tbody.innerHTML = `<tr class="empty-row"><td colspan="7">No entries match these filters.</td></tr>`;
                moreNote.style.display = 'none';
                return;
            }
            tbody.innerHTML = list.slice(0, shown).map(h => {
                const d = parseInt(h.delta, 10) || 0;
                const pos = d >= 0;
                const isCount = h.type === 'count';
                return `<tr>
                    <td data-label="Date &amp; time"><span class="date-cell">${FH.fmtDateTime(h.timestamp)}</span></td>
                    <td data-label="Brand"><span class="brand-tag">${esc(h.brand)}</span></td>
                    <td data-label="Size"><span class="size-tag">${esc(h.size)}</span></td>
                    <td data-label="Storeroom">${FH.storeTag(h.storeroom)}</td>
                    <td data-label="Change">${isCount
                        ? `<span class="change-badge count" title="Already on the shelf, added to the system"><i class="fas fa-clipboard-check"></i> ${t('+{n} not on system', { n: d })}</span>`
                        : `<span class="change-badge ${pos ? 'pos' : 'neg'}"><i class="fas ${pos ? 'fa-arrow-down' : 'fa-arrow-up'}"></i> ${pos ? '+' + d : d}</span>`}</td>
                    <td data-label="New qty"><span class="qty-badge">${esc(h.newQty)}</span></td>
                    <td data-label="By"><span class="date-cell">${h.user ? esc(h.user) : '—'}</span></td>
                </tr>`;
            }).join('');
            if (list.length > shown) {
                moreNote.style.display = 'block';
                moreNote.innerHTML = `${t('Showing {a} of {b}.', { a: shown, b: list.length })} <button type="button" class="btn btn-ghost btn-small" id="moreBtn">Show more</button>`;
                document.getElementById('moreBtn').addEventListener('click', () => { shown += PAGE; render(); });
            } else moreNote.style.display = 'none';
        }

        async function load() {
            try {
                const [data, inv] = await Promise.all([FH.api('getHistory'), FH.api('getInventory')]);
                history = data.rows || [];
                FH.setStores(inv.stores, inv.moveFromFirst);
                const stores = FH.storeNames(history.map(h => h.storeroom));
                storeSel.innerHTML = '<option value="">All</option>' + FH.storeOptions(stores, '');
                render();
            } catch (err) {
                tbody.innerHTML = `<tr class="empty-row"><td colspan="7"><i class="fas fa-triangle-exclamation"></i> ${t("Couldn't load history: {msg}", { msg: esc(err.message) })}</td></tr>`;
            }
        }

        document.querySelectorAll('#typeChips .chip').forEach(c => c.addEventListener('click', () => {
            type = c.dataset.type; shown = PAGE;
            document.querySelectorAll('#typeChips .chip').forEach(x => x.classList.toggle('active', x === c));
            render();
        }));
        storeSel.addEventListener('change', () => { shown = PAGE; render(); });
        searchInput.addEventListener('input', () => {
            query = searchInput.value.trim(); shown = PAGE;
            clearSearch.classList.toggle('show', query.length > 0);
            render();
        });
        clearSearch.addEventListener('click', () => {
            searchInput.value = ''; query = '';
            clearSearch.classList.remove('show');
            render(); searchInput.focus();
        });

        load();
    })();
</script>
</body>
</html>
