<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firsthill · tyre stock</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #1a0a0a;
            color: #f0e6e6;
            min-height: 100vh;
            padding: 24px;
        }
        .app {
            max-width: 1440px;
            margin: 0 auto;
            background: #1f0f0f;
            border-radius: 32px;
            padding: 28px 30px 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7), 0 0 0 1px #4a1a1a;
            border: 1px solid #5e1e1e;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px 20px;
            margin-bottom: 32px;
            border-bottom: 2px solid #8b1e1e;
            padding-bottom: 20px;
        }
        .logo h1 {
            font-weight: 700;
            font-size: 2rem;
            letter-spacing: -0.5px;
            color: #ff4d4d;
            text-shadow: 0 0 8px #7a1a1a;
        }
        .logo i { color: #ff2a2a; margin-right: 8px; }
        .logo span {
            font-weight: 400;
            color: #d6b0b0;
            font-size: 0.9rem;
            margin-left: 12px;
            background: #2f1212;
            padding: 4px 14px;
            border-radius: 40px;
            border: 1px solid #661c1c;
        }
        .warehouse-badge {
            background: #2b0f0f;
            padding: 10px 20px;
            border-radius: 60px;
            border: 1px solid #982a2a;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px 18px;
        }
        .warehouse-badge i { color: #ff5e5e; margin-right: 6px; }
        .wh-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 14px;
            font-weight: 500;
            font-size: 0.9rem;
        }
        .wh-list span {
            background: #3d1414;
            padding: 3px 12px;
            border-radius: 40px;
            border: 1px solid #6d2222;
            color: #f0cfcf;
        }
        .stats {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            background: #1b0b0b;
            padding: 18px 22px;
            border-radius: 20px;
            margin-bottom: 32px;
            border: 1px solid #601d1d;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.6);
        }
        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
        }
        .stat-item i { color: #e63e3e; width: 20px; }
        .stat-item strong { color: #ff7b7b; font-weight: 700; margin-right: 4px; }
        .transfer-card {
            background: #1f0c0c;
            border-radius: 24px;
            padding: 20px 24px 24px;
            margin-bottom: 40px;
            border: 1px solid #751f1f;
            box-shadow: 0 6px 12px rgba(0,0,0,0.5);
        }
        .transfer-card h3 {
            color: #ff5e5e;
            font-weight: 600;
            font-size: 1.3rem;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .transfer-card h3 i { color: #ff2a2a; }
        .transfer-grid {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 16px 20px;
        }
        .transfer-field {
            flex: 1 0 140px;
            min-width: 120px;
        }
        .transfer-field label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #b57474;
            margin-bottom: 4px;
            font-weight: 600;
        }
        .transfer-field select, 
        .transfer-field input {
            width: 100%;
            padding: 10px 12px;
            background: #2e1212;
            border: 1px solid #681f1f;
            border-radius: 14px;
            color: #f0e0e0;
            font-weight: 500;
            font-size: 0.9rem;
            outline: none;
            transition: 0.2s;
        }
        .transfer-field select:focus, 
        .transfer-field input:focus {
            border-color: #d43b3b;
            box-shadow: 0 0 0 3px #4f1515;
        }
        .transfer-field select option { background: #1c0a0a; color: #f0e0e0; }
        .btn-transfer {
            background: #b32828;
            border: none;
            color: white;
            font-weight: 700;
            padding: 10px 30px;
            border-radius: 40px;
            font-size: 1rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #d43b3b;
            transition: 0.15s;
            box-shadow: 0 4px 0 #621717;
            transform: translateY(-2px);
        }
        .btn-transfer:hover {
            background: #cc2f2f;
            box-shadow: 0 6px 0 #521212;
            transform: translateY(-3px);
        }
        .btn-transfer:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #521212;
        }
        .btn-transfer:disabled {
            opacity: 0.5;
            transform: translateY(0);
            box-shadow: 0 2px 0 #621717;
            pointer-events: none;
        }
        .table-wrapper {
            background: #130707;
            border-radius: 24px;
            padding: 6px 4px 4px 4px;
            border: 1px solid #631d1d;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            background: #1b0b0b;
            border-radius: 20px;
            overflow: hidden;
        }
        th {
            text-align: left;
            padding: 16px 14px;
            background: #2d1010;
            color: #ff8f8f;
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #751f1f;
        }
        td {
            padding: 14px 14px;
            border-bottom: 1px solid #341212;
            color: #ebd6d6;
        }
        tr:last-child td { border-bottom: none; }
        .qty-badge {
            background: #3b1515;
            padding: 4px 14px;
            border-radius: 40px;
            border: 1px solid #7f2828;
            font-weight: 600;
            color: #ffb3b3;
        }
        .warehouse-tag {
            background: #281010;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.75rem;
            border: 1px solid #591d1d;
            color: #dba8a8;
            white-space: nowrap;
        }
        .brand-tag { font-weight: 500; color: #f0c2c2; }
        .size-tag { color: #dbb9b9; }
        .empty-row td {
            text-align: center;
            padding: 40px 10px;
            color: #896060;
            font-style: italic;
        }
        .footnote {
            margin-top: 20px;
            text-align: right;
            font-size: 0.75rem;
            color: #754a4a;
            border-top: 1px solid #3d1515;
            padding-top: 14px;
        }
        .footnote i { color: #b33b3b; }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #2b0f0f;
            border: 1px solid #d43b3b;
            color: #f0e0e0;
            padding: 14px 28px;
            border-radius: 60px;
            font-weight: 500;
            box-shadow: 0 8px 20px rgba(0,0,0,0.8);
            z-index: 999;
            display: none;
            backdrop-filter: blur(4px);
            max-width: 90%;
            text-align: center;
        }
        .toast.show { display: block; }
        .toast i { margin-right: 10px; color: #ff5e5e; }

        @media (max-width: 700px) {
            .app { padding: 18px 14px; }
            .header { flex-direction: column; align-items: start; }
            .transfer-grid { flex-direction: column; align-items: stretch; }
            .btn-transfer { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="header">
        <div class="logo">
            <h1><i class="fas fa-warehouse"></i> Firsthill stock tracker <span>tyre warehouse</span></h1>
        </div>
        <div class="warehouse-badge">
            <i class="fas fa-location-dot"></i>
            <div class="wh-list">
                <span>Op1</span><span>Op2</span><span>Op3</span><span>Op4</span>
                <span>A1</span><span>A2</span><span>A3</span><span>ShopB</span><span>Ketan</span>
            </div>
        </div>
    </div>

    <div class="stats" id="statsContainer">
        <div class="stat-item"><i class="fas fa-boxes"></i> Total SKU: <strong id="totalSku">0</strong></div>
        <div class="stat-item"><i class="fas fa-cubes"></i> Total QTY: <strong id="totalQty">0</strong></div>
        <div class="stat-item"><i class="fas fa-cloud"></i> Google Sheet: <span id="lastUpdate">loading…</span></div>
    </div>

    <div class="transfer-card">
        <h3><i class="fas fa-arrow-right-arrow-left"></i> UPDATE QUANTITY</h3>
        <div class="transfer-grid">
            <div class="transfer-field">
                <label><i class="fas fa-tag"></i> Brand</label>
                <select id="transferBrand"><option value="">— select —</option></select>
            </div>
            <div class="transfer-field">
                <label><i class="fas fa-ruler"></i> Size</label>
                <select id="transferSize"><option value="">— select —</option></select>
            </div>
            <div class="transfer-field">
                <label><i class="fas fa-warehouse"></i> Warehouse</label>
                <select id="transferFrom"><option value="">— warehouse —</option></select>
            </div>
            <div class="transfer-field">
                <label><i class="fas fa-arrow-left"></i> Qty Change</label>
                <input type="number" id="transferQty" placeholder="+ add, - remove" value="1" min="-999" step="1">
            </div>
            <button class="btn-transfer" id="transferBtn"><i class="fas fa-pen-to-square"></i> UPDATE</button>
        </div>
        <div style="margin-top: 10px; font-size: 0.8rem; color: #9f5f5f;">
            <i class="fas fa-info-circle"></i> 
            Enter positive number to add, negative to remove
        </div>
    </div>

    <div class="table-wrapper">
        <table id="inventoryTable">
            <thead><tr><th>Brand</th><th>Size</th><th>QTY</th><th>Storeroom</th></tr></thead>
            <tbody id="tableBody">
                <tr class="empty-row"><td colspan="4"><i class="fas fa-spinner fa-pulse"></i> loading data …</td></tr>
            </tbody>
        </table>
    </div>
    <div class="footnote"><i class="fas fa-cloud-upload-alt"></i> FirstHill (pty) ltd · live sync</div>
</div>

<div id="toast" class="toast"><i class="fas fa-check-circle"></i> <span id="toastMsg">done</span></div>

<script>
    (function() {
        // ---------- CONFIG ----------
        // UPDATED: Your new Google Apps Script URL
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyywrzouTTE7nxw-oqfzM4oBI0xv1WKZMb83AcojXHvmf34LTiRtJWm86K6pbZqQy41EA/exec';
        const GOOGLE_SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQz7v74B9qEVB0RNbUqxwVMa5Yvnb2GxLPchxtz_8qyQyZWoT-Q0LIBb443JpvRxcKBXzHAzfaARfHG/pub?output=csv';

        let inventory = [];
        let isUpdating = false;

        const tbody = document.getElementById('tableBody');
        const totalSkuEl = document.getElementById('totalSku');
        const totalQtyEl = document.getElementById('totalQty');
        const lastUpdateEl = document.getElementById('lastUpdate');
        const brandSelect = document.getElementById('transferBrand');
        const sizeSelect = document.getElementById('transferSize');
        const fromSelect = document.getElementById('transferFrom');
        const qtyInput = document.getElementById('transferQty');
        const transferBtn = document.getElementById('transferBtn');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');

        function showToast(msg, isError = false) {
            toastMsg.textContent = msg;
            toast.style.display = 'block';
            toast.style.borderColor = isError ? '#b33b3b' : '#43b33b';
            toast.querySelector('i').className = isError ? 'fas fa-exclamation-circle' : 'fas fa-check-circle';
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => { toast.style.display = 'none'; }, 4000);
        }

        function parseCSV(csvText) {
            const rows = [];
            let row = [], field = '', inQuotes = false;
            for (let i = 0; i < csvText.length; i++) {
                const ch = csvText[i];
                if (ch === '"') {
                    if (inQuotes && csvText[i + 1] === '"') { field += '"'; i++; }
                    else { inQuotes = !inQuotes; }
                } else if (ch === ',' && !inQuotes) {
                    row.push(field.trim());
                    field = '';
                } else if ((ch === '\n' || ch === '\r') && !inQuotes) {
                    if (ch === '\r' && csvText[i + 1] === '\n') i++;
                    row.push(field.trim());
                    field = '';
                    if (row.some(v => v !== '')) rows.push(row);
                    row = [];
                } else {
                    field += ch;
                }
            }
            if (field !== '' || row.length) {
                row.push(field.trim());
                if (row.some(v => v !== '')) rows.push(row);
            }
            if (rows.length < 2) return [];
            const headers = rows[0].map(h => h.trim());
            return rows.slice(1).map(values => {
                const obj = {};
                headers.forEach((h, idx) => {
                    let val = values[idx] ?? '';
                    if (h.toLowerCase() === 'qty') {
                        val = parseInt(String(val).replace(/,/g, ''), 10) || 0;
                    }
                    obj[h] = val;
                });
                const qtyKey = headers.find(h => h.toLowerCase() === 'qty');
                const brandKey = headers.find(h => h.toLowerCase() === 'brand');
                const sizeKey = headers.find(h => h.toLowerCase() === 'size');
                const storeKey = headers.find(h =>
                    ['storeroom', 'store room', 'warehouse', 'location'].includes(h.toLowerCase())
                );
                return {
                    Brand: brandKey ? obj[brandKey] : '',
                    Size: sizeKey ? obj[sizeKey] : '',
                    QTY: qtyKey ? Number(obj[qtyKey]) || 0 : 0,
                    Storeroom: storeKey ? obj[storeKey] : ''
                };
            }).filter(item => item.Brand || item.Size || item.Storeroom);
        }

        function renderTable() {
            if (!inventory.length) {
                tbody.innerHTML = `<tr class="empty-row"><td colspan="4"><i class="fas fa-database"></i> no tyre data</td></tr>`;
                updateStats();
                populateSelects();
                return;
            }
            let html = '';
            let totalQty = 0;
            inventory.forEach(item => {
                totalQty += item.QTY;
                html += `<tr>
                    <td><span class="brand-tag"><i class="fas fa-circle" style="color:#c53535; font-size:0.5rem; margin-right:6px;"></i>${item.Brand}</span></td>
                    <td><span class="size-tag">${item.Size}</span></td>
                    <td><span class="qty-badge">${item.QTY}</span></td>
                    <td><span class="warehouse-tag"><i class="fas fa-warehouse" style="margin-right:4px;"></i>${item.Storeroom}</span></td>
                </tr>`;
            });
            tbody.innerHTML = html;
            totalSkuEl.textContent = inventory.length;
            totalQtyEl.textContent = totalQty;
            const now = new Date();
            lastUpdateEl.textContent = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            populateSelects();
        }

        function updateStats() {
            const totalQty = inventory.reduce((acc, i) => acc + i.QTY, 0);
            totalSkuEl.textContent = inventory.length;
            totalQtyEl.textContent = totalQty;
        }

        function populateSelects() {
            const brandSet = new Set(inventory.map(i => i.Brand));
            const currentBrand = brandSelect.value;
            brandSelect.innerHTML = '<option value="">— brand —</option>' + 
                Array.from(brandSet).sort().map(b => `<option value="${b}">${b}</option>`).join('');
            if (currentBrand && brandSet.has(currentBrand)) brandSelect.value = currentBrand;

            const selectedBrand = brandSelect.value;
            const sizeSet = new Set();
            inventory.forEach(i => {
                if (selectedBrand === '' || i.Brand === selectedBrand) sizeSet.add(i.Size);
            });
            const currentSize = sizeSelect.value;
            sizeSelect.innerHTML = '<option value="">— size —</option>' + 
                Array.from(sizeSet).sort().map(s => `<option value="${s}">${s}</option>`).join('');
            if (currentSize && sizeSet.has(currentSize)) sizeSelect.value = currentSize;

            const whSet = new Set(inventory.map(i => i.Storeroom));
            const currentFrom = fromSelect.value;
            fromSelect.innerHTML = '<option value="">— warehouse —</option>' + 
                Array.from(whSet).sort().map(w => `<option value="${w}">${w}</option>`).join('');
            if (currentFrom && whSet.has(currentFrom)) fromSelect.value = currentFrom;
        }

        async function writeToSheet(updatedInventory) {
            try {
                const formData = new URLSearchParams();
                formData.append('data', JSON.stringify(updatedInventory.map(row => ({
                    brand: row.Brand || '',
                    size: row.Size || '',
                    qty: parseInt(row.QTY) || 0,
                    storeroom: row.Storeroom || ''
                }))));

                console.log('Sending update to:', APPS_SCRIPT_URL);
                
                await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: formData.toString()
                });

                showToast('✅ Update sent to Google Sheet');
                return true;
            } catch (e) {
                console.error('Write error:', e);
                showToast('❌ Failed to update: ' + e.message, true);
                return false;
            }
        }

        async function performTransfer() {
            if (isUpdating) return;
            
            const brand = brandSelect.value;
            const size = sizeSelect.value;
            const fromWh = fromSelect.value;
            const qtyDelta = parseInt(qtyInput.value, 10);

            if (!brand || !size || !fromWh) {
                showToast('Please select Brand, Size and Warehouse.', true);
                return;
            }
            if (isNaN(qtyDelta) || qtyDelta === 0) {
                showToast('Enter a valid quantity (positive to add, negative to remove).', true);
                return;
            }

            const index = inventory.findIndex(item => 
                item.Brand === brand && item.Size === size && item.Storeroom === fromWh
            );

            if (index === -1) {
                showToast(`❌ No entry found: ${brand} ${size} in ${fromWh}`, true);
                return;
            }

            const currentQty = inventory[index].QTY;
            const newQty = currentQty + qtyDelta;
            if (newQty < 0) {
                showToast(`❌ Cannot go below 0. Current: ${currentQty}`, true);
                return;
            }

            const oldQty = currentQty;
            inventory[index].QTY = newQty;

            isUpdating = true;
            transferBtn.disabled = true;
            transferBtn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> syncing…';

            const success = await writeToSheet(inventory);

            if (success) {
                renderTable();
                showToast(`✅ ${brand} ${size} in ${fromWh}: ${oldQty} → ${newQty}`);
            } else {
                inventory[index].QTY = oldQty;
                renderTable();
                showToast('❌ Update failed, changes reverted.', true);
            }

            isUpdating = false;
            transferBtn.disabled = false;
            transferBtn.innerHTML = '<i class="fas fa-pen-to-square"></i> UPDATE';
        }

        async function loadInventoryFromGoogleSheet() {
            try {
                console.log('Loading from CSV URL:', GOOGLE_SHEET_CSV_URL);
                const response = await fetch(GOOGLE_SHEET_CSV_URL, { cache: 'no-store' });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const csvText = await response.text();
                console.log('CSV loaded, length:', csvText.length);
                const parsed = parseCSV(csvText);
                if (!parsed.length) throw new Error('No data rows found.');
                inventory = parsed;
                renderTable();
                showToast('📥 Inventory loaded from Google Sheet');
            } catch (error) {
                console.error('Load error:', error);
                inventory = [];
                tbody.innerHTML = `<tr class="empty-row">
                    <td colspan="4"><i class="fas fa-triangle-exclamation"></i> unable to load Google Sheet data</td>
                </tr>`;
                updateStats();
                populateSelects();
                lastUpdateEl.textContent = 'Load failed';
                showToast('❌ Failed to load sheet data: ' + error.message, true);
            }
        }

        function init() {
            loadInventoryFromGoogleSheet();
            transferBtn.addEventListener('click', performTransfer);
            brandSelect.addEventListener('change', populateSelects);
        }

        init();
    })();
</script>
</body>
</html>
