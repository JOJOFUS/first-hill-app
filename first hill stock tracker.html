<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firsthill · tyre stock</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Font (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #1a0a0a;
            color: #f0e6e6;
            min-height: 100vh;
            padding: 24px;
        }

        .app {
            max-width: 1440px;
            margin: 0 auto;
            background: #1f0f0f;
            border-radius: 32px;
            padding: 28px 30px 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7), 0 0 0 1px #4a1a1a;
            border: 1px solid #5e1e1e;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px 20px;
            margin-bottom: 32px;
            border-bottom: 2px solid #8b1e1e;
            padding-bottom: 20px;
        }

        .logo h1 {
            font-weight: 700;
            font-size: 2rem;
            letter-spacing: -0.5px;
            color: #ff4d4d;
            text-shadow: 0 0 8px #7a1a1a;
        }
        .logo i {
            color: #ff2a2a;
            margin-right: 8px;
        }
        .logo span {
            font-weight: 400;
            color: #d6b0b0;
            font-size: 0.9rem;
            margin-left: 12px;
            background: #2f1212;
            padding: 4px 14px;
            border-radius: 40px;
            border: 1px solid #661c1c;
        }

        .warehouse-badge {
            background: #2b0f0f;
            padding: 10px 20px;
            border-radius: 60px;
            border: 1px solid #982a2a;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px 18px;
        }
        .warehouse-badge i {
            color: #ff5e5e;
            margin-right: 6px;
        }
        .wh-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 14px;
            font-weight: 500;
            font-size: 0.9rem;
        }
        .wh-list span {
            background: #3d1414;
            padding: 3px 12px;
            border-radius: 40px;
            border: 1px solid #6d2222;
            color: #f0cfcf;
        }

        .stats {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            background: #1b0b0b;
            padding: 18px 22px;
            border-radius: 20px;
            margin-bottom: 32px;
            border: 1px solid #601d1d;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.6);
        }
        .stat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
        }
        .stat-item i {
            color: #e63e3e;
            width: 20px;
        }
        .stat-item strong {
            color: #ff7b7b;
            font-weight: 700;
            margin-right: 4px;
        }

        .transfer-card {
            background: #1f0c0c;
            border-radius: 24px;
            padding: 20px 24px 24px;
            margin-bottom: 40px;
            border: 1px solid #751f1f;
            box-shadow: 0 6px 12px rgba(0,0,0,0.5);
        }
        .transfer-card h3 {
            color: #ff5e5e;
            font-weight: 600;
            font-size: 1.3rem;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .transfer-card h3 i {
            color: #ff2a2a;
        }
        .transfer-grid {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-end;
            gap: 16px 20px;
        }
        .transfer-field {
            flex: 1 0 140px;
            min-width: 120px;
        }
        .transfer-field label {
            display: block;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #b57474;
            margin-bottom: 4px;
            font-weight: 600;
        }
        .transfer-field select, 
        .transfer-field input {
            width: 100%;
            padding: 10px 12px;
            background: #2e1212;
            border: 1px solid #681f1f;
            border-radius: 14px;
            color: #f0e0e0;
            font-weight: 500;
            font-size: 0.9rem;
            outline: none;
            transition: 0.2s;
        }
        .transfer-field select:focus, 
        .transfer-field input:focus {
            border-color: #d43b3b;
            box-shadow: 0 0 0 3px #4f1515;
        }
        .transfer-field select option {
            background: #1c0a0a;
            color: #f0e0e0;
        }
        .btn-transfer {
            background: #b32828;
            border: none;
            color: white;
            font-weight: 700;
            padding: 10px 30px;
            border-radius: 40px;
            font-size: 1rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #d43b3b;
            transition: 0.15s;
            box-shadow: 0 4px 0 #621717;
            transform: translateY(-2px);
        }
        .btn-transfer:hover {
            background: #cc2f2f;
            box-shadow: 0 6px 0 #521212;
            transform: translateY(-3px);
        }
        .btn-transfer:active {
            transform: translateY(2px);
            box-shadow: 0 1px 0 #521212;
        }

        .table-wrapper {
            background: #130707;
            border-radius: 24px;
            padding: 6px 4px 4px 4px;
            border: 1px solid #631d1d;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            background: #1b0b0b;
            border-radius: 20px;
            overflow: hidden;
        }
        th {
            text-align: left;
            padding: 16px 14px;
            background: #2d1010;
            color: #ff8f8f;
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #751f1f;
        }
        td {
            padding: 14px 14px;
            border-bottom: 1px solid #341212;
            color: #ebd6d6;
        }
        tr:last-child td {
            border-bottom: none;
        }
        .qty-badge {
            background: #3b1515;
            padding: 4px 14px;
            border-radius: 40px;
            border: 1px solid #7f2828;
            font-weight: 600;
            color: #ffb3b3;
        }
        .warehouse-tag {
            background: #281010;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.75rem;
            border: 1px solid #591d1d;
            color: #dba8a8;
            white-space: nowrap;
        }
        .brand-tag {
            font-weight: 500;
            color: #f0c2c2;
        }
        .size-tag {
            color: #dbb9b9;
        }
        .empty-row td {
            text-align: center;
            padding: 40px 10px;
            color: #896060;
            font-style: italic;
        }
        .fa-arrows-rotate {
            color: #d64343;
        }
        .footnote {
            margin-top: 20px;
            text-align: right;
            font-size: 0.75rem;
            color: #754a4a;
            border-top: 1px solid #3d1515;
            padding-top: 14px;
        }
        .footnote i {
            color: #b33b3b;
        }

        @media (max-width: 700px) {
            .app { padding: 18px 14px; }
            .header { flex-direction: column; align-items: start; }
            .transfer-grid { flex-direction: column; align-items: stretch; }
            .btn-transfer { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
<div class="app">
    <!-- header -->
    <div class="header">
        <div class="logo">
            <h1><i class="fas fa-warehouse"></i> Firsthill stock tracker <span>tyre warehouse</span></h1>
        </div>
        <div class="warehouse-badge">
            <i class="fas fa-location-dot"></i>
            <div class="wh-list">
                <span>Op1</span><span>Op2</span><span>Op3</span><span>Op4</span>
                <span>A1</span><span>A2</span><span>A3</span><span>ShopB</span><span>Ketan</span>
            </div>
        </div>
    </div>

    <!-- stats -->
    <div class="stats" id="statsContainer">
        <div class="stat-item"><i class="fas fa-boxes"></i> Total SKU: <strong id="totalSku">0</strong></div>
        <div class="stat-item"><i class="fas fa-cubes"></i> Total QTY: <strong id="totalQty">0</strong></div>
        <div class="stat-item"><i class="fas fa-arrows-rotate"></i> Last update: <span id="lastUpdate">—</span></div>
    </div>

    <!-- transfer card -->
    <div class="transfer-card">
        <h3><i class="fas fa-arrow-right-arrow-left"></i> TRANSFER & QTY UPDATE</h3>
        <div class="transfer-grid">
            <div class="transfer-field">
                <label><i class="fas fa-tag"></i> Brand</label>
                <select id="transferBrand"><option value="">— select —</option></select>
            </div>
            <div class="transfer-field">
                <label><i class="fas fa-ruler"></i> Size</label>
                <select id="transferSize"><option value="">— select —</option></select>
            </div>
            <div class="transfer-field">
                <label><i class="fas fa-arrow-right"></i> From</label>
                <select id="transferFrom"><option value="">— warehouse —</option></select>
            </div>
            <div class="transfer-field">
                <label><i class="fas fa-arrow-left"></i> To / QTY change</label>
                <input type="number" id="transferQty" placeholder="+ / - qty" value="1" min="-999" step="1">
            </div>
            <button class="btn-transfer" id="transferBtn"><i class="fas fa-pen-to-square"></i> UPDATE</button>
        </div>
        <div style="margin-top: 10px; font-size: 0.8rem; color: #9f5f5f;"><i class="fas fa-info-circle"></i> Enter positive to add, negative to subtract. Transfer updates the 'from' warehouse.</div>
    </div>

    <!-- table -->
    <div class="table-wrapper">
        <table id="inventoryTable">
            <thead>
                <tr><th>Brand</th><th>Size</th><th>QTY</th><th>Storeroom</th></tr>
            </thead>
            <tbody id="tableBody">
                <tr class="empty-row"><td colspan="4"><i class="fas fa-spinner fa-pulse"></i> loading data …</td></tr>
            </tbody>
        </table>
    </div>
    <div class="footnote"><i class="fas fa-cloud-upload-alt"></i> FirstHill (pty)ltd </div>
</div>

<script>
    (function() {
        // ----- MOCK CSV with exact brands: Road cruza, Sailun, Comforser, Rovello, Doublestar, Longway, Sunwide, Taishan, Stallion -----
        const MOCK_CSV = `Brand,Size,QTY,Storeroom
Road cruza,205/55R16,8,Op1
Road cruza,225/45R17,6,Op2
Sailun,205/55R16,14,A1
Sailun,215/60R16,5,Op3
Comforser,225/45R17,9,ShopB
Comforser,205/55R16,7,A2
Rovello,215/60R16,11,Op4
Rovello,225/45R17,3,Ketan
Doublestar,205/55R16,6,A3
Doublestar,215/60R16,12,Op1
Longway,225/45R17,4,Op2
Longway,205/55R16,10,ShopB
Sunwide,215/60R16,8,A1
Sunwide,225/45R17,5,Op3
Taishan,205/55R16,9,A2
Taishan,215/60R16,7,Op4
Stallion,225/45R17,6,Ketan
Stallion,205/55R16,12,A3
Road cruza,215/60R16,3,Op2
Sailun,225/45R17,4,A1
Comforser,215/60R16,5,Op1
Rovello,205/55R16,8,ShopB
Doublestar,225/45R17,3,Op3
Longway,215/60R16,6,A2
Sunwide,205/55R16,7,Op4
Taishan,225/45R17,4,Ketan
Stallion,215/60R16,5,A1`;

        // state
        let inventory = [];
        const warehouseList = ['Op1','Op2','Op3','Op4','A1','A2','A3','ShopB','Ketan'];

        // DOM
        const tbody = document.getElementById('tableBody');
        const totalSkuEl = document.getElementById('totalSku');
        const totalQtyEl = document.getElementById('totalQty');
        const lastUpdateEl = document.getElementById('lastUpdate');

        const brandSelect = document.getElementById('transferBrand');
        const sizeSelect = document.getElementById('transferSize');
        const fromSelect = document.getElementById('transferFrom');
        const qtyInput = document.getElementById('transferQty');
        const transferBtn = document.getElementById('transferBtn');

        // helpers
        function parseCSV(csvText) {
            const lines = csvText.split(/\r?\n/).filter(line => line.trim() !== '');
            if (lines.length < 2) return [];
            const headers = lines[0].split(',').map(h => h.trim());
            const result = [];
            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].split(',').map(v => v.trim());
                if (values.length < 4) continue;
                const obj = {};
                headers.forEach((h, idx) => {
                    let val = values[idx] || '';
                    if (h === 'QTY') val = parseInt(val, 10) || 0;
                    obj[h] = val;
                });
                obj.QTY = Number(obj.QTY);
                if (isNaN(obj.QTY)) obj.QTY = 0;
                result.push(obj);
            }
            return result;
        }

        function renderTable() {
            if (!inventory.length) {
                tbody.innerHTML = `<tr class="empty-row"><td colspan="4"><i class="fas fa-database"></i> no tyre data</td></tr>`;
                updateStats();
                populateSelects();
                return;
            }
            let html = '';
            let totalQty = 0;
            inventory.forEach(item => {
                totalQty += item.QTY;
                html += `<tr>
                    <td><span class="brand-tag"><i class="fas fa-circle" style="color:#c53535; font-size:0.5rem; margin-right:6px;"></i>${item.Brand}</span></td>
                    <td><span class="size-tag">${item.Size}</span></td>
                    <td><span class="qty-badge">${item.QTY}</span></td>
                    <td><span class="warehouse-tag"><i class="fas fa-warehouse" style="margin-right:4px;"></i>${item.Storeroom}</span></td>
                </tr>`;
            });
            tbody.innerHTML = html;
            totalSkuEl.textContent = inventory.length;
            totalQtyEl.textContent = totalQty;
            const now = new Date();
            lastUpdateEl.textContent = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            populateSelects();
        }

        function updateStats() {
            const totalQty = inventory.reduce((acc, i) => acc + i.QTY, 0);
            totalSkuEl.textContent = inventory.length;
            totalQtyEl.textContent = totalQty;
        }

        function populateSelects() {
            // brands
            const brandSet = new Set(inventory.map(i => i.Brand));
            const currentBrand = brandSelect.value;
            brandSelect.innerHTML = '<option value="">— brand —</option>' + 
                Array.from(brandSet).sort().map(b => `<option value="${b}">${b}</option>`).join('');
            if (currentBrand && brandSet.has(currentBrand)) brandSelect.value = currentBrand;

            // sizes
            const selectedBrand = brandSelect.value;
            const sizeSet = new Set();
            inventory.forEach(i => {
                if (selectedBrand === '' || i.Brand === selectedBrand) sizeSet.add(i.Size);
            });
            const currentSize = sizeSelect.value;
            sizeSelect.innerHTML = '<option value="">— size —</option>' + 
                Array.from(sizeSet).sort().map(s => `<option value="${s}">${s}</option>`).join('');
            if (currentSize && sizeSet.has(currentSize)) sizeSelect.value = currentSize;

            // from warehouse
            const whSet = new Set(inventory.map(i => i.Storeroom));
            const currentFrom = fromSelect.value;
            fromSelect.innerHTML = '<option value="">— from —</option>' + 
                Array.from(whSet).sort().map(w => `<option value="${w}">${w}</option>`).join('');
            if (currentFrom && whSet.has(currentFrom)) fromSelect.value = currentFrom;
        }

        function performTransfer() {
            const brand = brandSelect.value;
            const size = sizeSelect.value;
            const fromWh = fromSelect.value;
            const qtyDelta = parseInt(qtyInput.value, 10);
            if (!brand || !size || !fromWh) {
                alert('Please select Brand, Size and "From" warehouse.');
                return;
            }
            if (isNaN(qtyDelta) || qtyDelta === 0) {
                alert('Enter a valid quantity (positive to add, negative to subtract).');
                return;
            }

            const index = inventory.findIndex(item => 
                item.Brand === brand && item.Size === size && item.Storeroom === fromWh
            );

            if (index === -1) {
                alert(`No tyre found: ${brand} ${size} in ${fromWh}.`);
                return;
            }

            const currentQty = inventory[index].QTY;
            const newQty = currentQty + qtyDelta;
            if (newQty < 0) {
                alert(`Cannot reduce below 0. Current QTY is ${currentQty}.`);
                return;
            }
            inventory[index].QTY = newQty;
            renderTable();
            console.log(`[MOCK] updated ${brand} ${size} in ${fromWh}: ${currentQty} → ${newQty}`);
        }

        function loadInventoryFromCSV(csvText) {
            const parsed = parseCSV(csvText);
            if (parsed.length) {
                inventory = parsed;
            } else {
                // fallback with exact brands
                inventory = [
                    { Brand: 'Road cruza', Size: '205/55R16', QTY: 8, Storeroom: 'Op1' },
                    { Brand: 'Sailun', Size: '225/45R17', QTY: 4, Storeroom: 'A1' },
                ];
            }
            renderTable();
        }

        function init() {
            loadInventoryFromCSV(MOCK_CSV);
            transferBtn.addEventListener('click', performTransfer);
            brandSelect.addEventListener('change', function() {
                populateSelects();
            });
        }

        init();
    })();
</script>
</body>
</html>
